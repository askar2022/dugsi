services:
  postgres-staging-like:
    image: postgres:16
    container_name: dugsi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dugsi_dev
      POSTGRES_USER: dugsi
      POSTGRES_PASSWORD: dugsi
    ports:
      - "5432:5432"
    volumes:
      - dugsi_pg:/var/lib/postgresql/data

volumes:
  dugsi_pg:
